{% extends "base.html" %}

{% block content %}
<div class="success-container">
    <div class="success-box">
        <h2 class="success-title">✅ Dados salvos com sucesso!</h2>
        <p class="success-message">Os dados do paciente foram registrados no sistema.</p>
        
        <div class="success-actions">
            <a href="{{ url_for('novo_cadastro') }}" class="btn btn-primary" style="display: inline-block; background-color: #007bff; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; margin: 10px;">
                <span style="margin-right: 8px;">➕</span> Cadastrar Novo Paciente
            </a>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary" style="display: inline-block; background-color: #6c757d; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; margin: 10px;">
                <span style="margin-right: 8px;">📊</span> Ver Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>ICB - Formulario de Cirurgia Capilar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #0f1319;
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-header {
            background: linear-gradient(135deg, #141a24 0%, #1a2233 100%);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
        }

        .header-logo {
            height: 120px;
            width: auto;
            margin-bottom: 0.5rem;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .header-subtitle {
            font-size: 0.7rem;
            color: #5b8fb9;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .header-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #7ab3ef;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
        }

        .header-badge:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
            color: #a0ccf5;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
            max-width: 900px;
            width: 100%;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .card {
            background: linear-gradient(145deg, #1a2133 0%, #161d2b 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 2rem 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 150px;
        }

        .card:hover {
            background: linear-gradient(145deg, #1f2940 0%, #1b2436 100%);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .card-icon.blue {
            background: rgba(59, 130, 246, 0.15);
            color: #5b9cf5;
        }

        .card-icon.red {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .card-icon.gray {
            background: rgba(148, 163, 184, 0.12);
            color: #94a3b8;
        }

        .card-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            color: #c8d5e3;
            line-height: 1.3;
        }

        .footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .footer-content {
            text-align: center;
            letter-spacing: 0.5px;
        }

        .footer-content b {
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }

            .top-header {
                padding: 1rem;
                flex-direction: column;
                gap: 0.8rem;
                text-align: center;
            }

            .header-left {
                flex-direction: column;
            }

            .header-title {
                font-size: 1.1rem;
            }

            .card {
                padding: 1.5rem 1rem;
                min-height: 130px;
            }

            .main-content {
                padding: 1rem;
                align-items: flex-start;
                padding-top: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }

            .card {
                padding: 1.2rem 0.8rem;
                min-height: 110px;
            }

            .card-icon {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }

            .card-label {
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="header-left">
            <img src="{{ url_for('static', filename='img/icb_logo_new.png') }}" alt="ICB" class="header-logo">
            <div class="header-title-group">
                <span class="header-title">Formulario de Transplante Capilar</span>
                <span class="header-subtitle">CapillaryTracker v2026</span>
            </div>
        </div>
        <a href="{{ url_for('controle_cirurgias') }}" class="header-badge">Painel de Controle</a>
    </header>

    <main class="main-content">
        <div class="cards-grid">
            <a href="{{ url_for('novo_cadastro') }}" class="card-link">
                <div class="card">
                    <div class="card-icon blue">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <line x1="19" y1="8" x2="19" y2="14"/>
                            <line x1="22" y1="11" x2="16" y2="11"/>
                        </svg>
                    </div>
                    <span class="card-label">Novo Cadastro</span>
                </div>
            </a>

            <a href="{{ url_for('dashboard') }}" class="card-link">
                <div class="card">
                    <div class="card-icon blue">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                    </div>
                    <span class="card-label">Dashboard</span>
                </div>
            </a>

            <a href="{{ url_for('login_medicos') }}" class="card-link">
                <div class="card">
                    <div class="card-icon blue">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                    </div>
                    <span class="card-label">Dashboard Medicos</span>
                </div>
            </a>

            <a href="{{ url_for('controle_cirurgias') }}" class="card-link">
                <div class="card">
                    <div class="card-icon blue">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="12" y1="18" x2="12" y2="12"/>
                            <line x1="9" y1="15" x2="15" y2="15"/>
                        </svg>
                    </div>
                    <span class="card-label">Controle de Cirurgias</span>
                </div>
            </a>

            <a href="{{ url_for('estudo_cientifico_login') }}" class="card-link">
                <div class="card">
                    <div class="card-icon blue">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <span class="card-label">Estudo Cientifico</span>
                </div>
            </a>

            <a href="{{ url_for('necrose') }}" class="card-link">
                <div class="card">
                    <div class="card-icon red">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </div>
                    <span class="card-label">Registrar Necrose</span>
                </div>
            </a>

            <a href="{{ url_for('admin.login') }}" class="card-link">
                <div class="card">
                    <div class="card-icon gray">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </div>
                    <span class="card-label">Administracao</span>
                </div>
            </a>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            Desenvolvido por <b>ICB Tech</b> since <b>2023</b>
        </div>
    </footer>
</body>
</html>

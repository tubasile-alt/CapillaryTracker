{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>📊 Análise de Dados de Necrose</h2>
    
    <!-- Resumo estatístico -->
    <div class="stats-summary">
        <div class="stat-card">
            <div class="stat-title">Total de Casos</div>
            <div class="stat-value" id="total-casos">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Média Densidade 1ª Faixa</div>
            <div class="stat-value" id="media-densidade">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Média Solução Frente</div>
            <div class="stat-value" id="media-solucao-frente">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Média Infiltração</div>
            <div class="stat-value" id="media-infiltracao">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Média Sangramento</div>
            <div class="stat-value" id="media-sangramento">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Casos com Transamin</div>
            <div class="stat-value" id="casos-transamin">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Casos com Tadalafil</div>
            <div class="stat-value" id="casos-tadalafil">--</div>
        </div>
    </div>
    
    <!-- Cards de resumo por unidade -->
    <div id="unit-summary-cards" class="unit-summary-section" style="margin-bottom: 30px;">
        <!-- Cards serão inseridos aqui via JavaScript -->
    </div>
    
    <!-- Filtros -->
    <div class="filters-section">
        <div class="filter-row">
            <div class="filter-item">
                <label for="filter-unit">Unidade:</label>
                <select id="filter-unit" class="form-control">
                    <option value="">Todas as Unidades</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="filter-month">Mês:</label>
                <select id="filter-month" class="form-control">
                    <option value="">Todos os Meses</option>
                    <option value="01">Janeiro</option>
                    <option value="02">Fevereiro</option>
                    <option value="03">Março</option>
                    <option value="04">Abril</option>
                    <option value="05">Maio</option>
                    <option value="06">Junho</option>
                    <option value="07">Julho</option>
                    <option value="08">Agosto</option>
                    <option value="09">Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="filter-year">Ano:</label>
                <select id="filter-year" class="form-control">
                    <option value="">Todos os Anos</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                </select>
            </div>
            <div class="filter-item">
                <button type="button" class="btn btn-primary" onclick="applyFilters()">Aplicar Filtros</button>
            </div>
        </div>
    </div>

    <!-- Botões de ação -->
    <div class="action-buttons" style="margin: 20px 0; text-align: center;">
        <button type="button" class="btn btn-primary" onclick="loadAnalysisData()">🔄 Atualizar Dados</button>
        <button type="button" class="btn btn-success" onclick="exportData()">📁 Exportar Dados</button>
        <a href="/necrose" class="btn btn-secondary">← Voltar para Registro</a>
    </div>
    
    <!-- Cards de análise -->
    <div id="analysis-cards" class="analysis-cards">
        <div class="loading-message">Carregando dados...</div>
    </div>
</div>

<style>
.stats-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
    max-width: 1200px;
    margin: 0 auto 30px auto;
}

.stat-card {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

    padding: 15px;
    border-radius: 10px;
    text-align: center;
    min-width: 140px;
}

.stat-title {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 10px;
}

.stat-value {

    font-weight: bold;
}

.analysis-cards {

    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));

    margin-top: 20px;
}

}

.card-header {

    padding-bottom: 10px;
    border-bottom: 2px solid #f0f0f0;
}

.patient-name {

    font-size: 18px;
    color: #333;
}

.necrose-grade {

}

.card-info {
    display: grid;

    gap: 15px;
    margin-bottom: 15px;
}

.info-item {
    display: flex;
    align-items: center;

.info-label {

}

.info-value {

}

.surgical-metrics {

}

.surgical-metrics h4 {
    margin-bottom: 10px;
    color: #495057;
    font-size: 16px;
}

.metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
}

.metric-item {
    text-align: center;
    padding: 8px;
    background: white;
    border-radius: 5px;
    border: 1px solid #e9ecef;
}

.metric-label {
    font-size: 12px;
    color: #6c757d;
    font-weight: bold;
}

.metric-value {
    font-size: 14px;
    color: #495057;
    font-weight: bold;
    margin-top: 5px;
}

.loading-message {
    text-align: center;
    padding: 40px;
    color: #666;
    font-size: 16px;
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
    margin: 0 5px;
}

.btn-primary {
    background: #007bff;
    color: white;
}

.btn-secondary {
    background: #6c757d;
    color: white;
}

.btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

.action-buttons {
    margin: 20px 0;
    text-align: center;
}

.filters-section {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.filter-row {
    display: flex;
    gap: 15px;
    align-items: end;
    flex-wrap: wrap;
}

.filter-item {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 150px;
}

.filter-item label {
    font-weight: bold;

    color: #495057;
}

.form-control {

    border: 1px solid #ced4da;
    border-radius: 5px;

}

.patient-photo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 10px;
    border: 2px solid #dee2e6;
}

/* Thumbnails de fotos */
.photo-thumbnails {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.photo-thumbnail {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;

    border: 2px solid #ddd;

}

/* Modal para popup das fotos */
.photo-modal {
    display: none;

.photo-modal-content {

.modal-image {

}

.close-modal {

    top: 15px;
    right: 35px;
    color: white;
    font-size: 40px;

/* Cards de resumo por unidade */
.unit-summary-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.unit-summary-card {
    background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    color: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;

.unit-summary-card:hover {

}

.unit-title {

    font-weight: bold;

.unit-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;

.unit-stat-item {
    text-align: center;
    padding: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
}

}

.no-photos-message {

<script>


function displayAnalysisCards(necroses) {
    const cardsContainer = document.getElementById('analysis-cards');

        cardsContainer.innerHTML = '<div class="loading-message">Nenhum caso de necrose encontrado</div>';
        return;
    }
    
    const cardsHTML = necroses.map(necrose => {
        // Criar thumbnails das fotos
        let photosHTML = '';
        if (necrose.photos && necrose.photos.length > 0) {
            photosHTML = `
                <div class="photo-thumbnails">
                    ${necrose.photos.map(photo => `
                        <img src="${photo.path}" 
                             alt="${photo.description}" 
                             class="photo-thumbnail"
                             onclick="openPhotoModal('${photo.path}', '${photo.description}')"
                             title="${photo.description}">
                    `).join('')}
                </div>
            `;
        } else {
            photosHTML = '<div class="no-photos-message">Nenhuma foto anexada</div>';
        }
        
        return `
            <div class="necrose-card">
                <div class="card-header">
                    <div style="display: flex; align-items: center;">
                        <img src="/static/img/user-icon.svg" alt="Paciente" class="patient-photo">
                        <div class="patient-name">${necrose.paciente_nome}</div>
                    </div>
                    <div class="necrose-grade grade-${necrose.grau_necrose?.toLowerCase() || 'leve'}">
                        ${necrose.grau_necrose || 'Não informado'}
                    </div>
                </div>
                
                <div class="card-info">
                    <div class="info-item">
                        <span class="info-label">📅 Unidade:</span>
                        <span class="info-value">${necrose.unidade}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">👨‍⚕️ Médico:</span>
                        <span class="info-value">${necrose.medico_responsavel || 'Não informado'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">📏 Tamanho Total:</span>
                        <span class="info-value">${necrose.tamanho_total} cm</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">🔢 Necroses:</span>
                        <span class="info-value">${necrose.numero_necroses}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">📋 Faixas:</span>
                        <span class="info-value">${necrose.faixas_acometidas || 'Não informado'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">📅 Data Cirurgia:</span>
                        <span class="info-value">${necrose.data_cirurgia}</span>
                    </div>
                </div>
                
                ${photosHTML}
                
                <div class="surgical-metrics">
                    <h4>📊 Métricas Cirúrgicas</h4>
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <div class="metric-label">Infiltração</div>
                            <div class="metric-value">${necrose.infiltracao || 'N/A'}</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">Sangramento</div>
                            <div class="metric-value">${necrose.sangramento || 'N/A'}</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">Tempo</div>
                            <div class="metric-value">${necrose.tempo_cirurgia || 'N/A'}h</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">Tadalafila</div>
                            <div class="metric-value">${necrose.tadalafila || 'N/A'}</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">Técnica</div>
                            <div class="metric-value">${necrose.tecnica || 'N/A'}</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">Solução Frente</div>
                            <div class="metric-value">${necrose.solucao_frente || 'N/A'}</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
                </div>
                <div class="info-item">
                    <span class="info-label">👨‍⚕️ Médico:</span>
                    <span class="info-value">${necrose.medico_responsavel || 'Não informado'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📅 Data Cirurgia:</span>
                    <span class="info-value">${necrose.data_cirurgia}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📅 Data Avaliação:</span>
                    <span class="info-value">${necrose.data_avaliacao}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🔢 Número de Necroses:</span>
                    <span class="info-value">${necrose.numero_necroses}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📏 Tamanho Total:</span>
                    <span class="info-value">${necrose.tamanho_total} cm</span>
                </div>
                <div class="info-item" style="grid-column: 1 / -1;">
                    <span class="info-label">🎯 Faixas Acometidas:</span>
                    <span class="info-value">${necrose.faixas_acometidas}</span>
                </div>
            </div>
            
            <div class="surgical-metrics">
                <h4>📊 Métricas Cirúrgicas</h4>
                <div class="metrics-grid">
                    <div class="metric-item">
                        <div class="metric-label">Seringas</div>
                        <div class="metric-value">${necrose.infiltracao || 'N/A'}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Sangramento</div>
                        <div class="metric-value">${necrose.sangramento || 'N/A'}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Tempo (horas)</div>
                        <div class="metric-value">${necrose.tempo_cirurgia || 'N/A'}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Tadalafila</div>
                        <div class="metric-value">${necrose.tadalafila || 'N/A'}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Solução Frente</div>
                        <div class="metric-value">${necrose.solucao_frente || 'N/A'}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Técnica</div>

                    </div>
                </div>
            </div>
        </div>
    `).join('');
    
    cardsContainer.innerHTML = cardsHTML;
}

// Função para abrir modal de foto
function openPhotoModal(imagePath, description) {
    // Criar modal se não existir
    let modal = document.getElementById('photo-modal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'photo-modal';
        modal.className = 'photo-modal';
        modal.innerHTML = `
            <div class="photo-modal-content">
                <span class="close-modal" onclick="closePhotoModal()">&times;</span>
                <img id="modal-image" class="modal-image" src="" alt="">
                <div id="modal-description" style="color: white; text-align: center; margin-top: 10px; font-size: 16px;"></div>
            </div>
        `;
        document.body.appendChild(modal);
        
        // Fechar modal ao clicar fora da imagem
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closePhotoModal();
            }
        });
    }
    
    // Atualizar imagem e descrição
    document.getElementById('modal-image').src = imagePath;
    document.getElementById('modal-description').textContent = description;
    modal.style.display = 'block';
    
    // Fechar com tecla ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closePhotoModal();
        }
    });
}

// Função para fechar modal de foto
function closePhotoModal() {
    const modal = document.getElementById('photo-modal');
    if (modal) {
        modal.style.display = 'none';
    }
}

// Função para exibir cards de resumo por unidade
function displayUnitSummaryCards(statsByUnit, allUnits) {
    const summaryContainer = document.getElementById('unit-summary-cards');
    
    if (!statsByUnit || Object.keys(statsByUnit).length === 0) {
        summaryContainer.innerHTML = '<div class="loading-message">Nenhum dado disponível por unidade</div>';
        return;
    }
    
    // Incluir unidades sem dados também
    const unitsToShow = allUnits || Object.keys(statsByUnit);
    
    const cardsHTML = unitsToShow.map(unit => {
        const stats = statsByUnit[unit] || {
            total_casos: 0,
            casos_leves: 0,
            casos_moderados: 0,
            casos_severos: 0,
            tamanho_medio: 0
        };
        
        const gradientClass = stats.total_casos > 0 
            ? (stats.casos_severos > 0 ? 'gradient-red' : 'gradient-green')
            : 'gradient-gray';
        
        return `
            <div class="unit-summary-card ${gradientClass}" onclick="filterByUnit('${unit}')">
                <div class="unit-title">📍 ${unit}</div>
                <div class="unit-stats">
                    <div class="unit-stat-item">
                        <span class="unit-stat-value">${stats.total_casos}</span>
                        <div class="unit-stat-label">Total de Casos</div>
                    </div>
                    <div class="unit-stat-item">
                        <span class="unit-stat-value">${stats.casos_severos}</span>
                        <div class="unit-stat-label">Casos Severos</div>
                    </div>
                    <div class="unit-stat-item">
                        <span class="unit-stat-value">${stats.tamanho_medio}</span>
                        <div class="unit-stat-label">Tamanho Médio (cm)</div>
                    </div>
                    <div class="unit-stat-item">
                        <span class="unit-stat-value">${stats.casos_leves}</span>
                        <div class="unit-stat-label">Casos Leves</div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    summaryContainer.innerHTML = cardsHTML;
}

// Função para filtrar por unidade específica
function filterByUnit(unit) {
    const unitFilter = document.getElementById('filter-unit');
    unitFilter.value = unit;
    applyFilters();
}

function updateStats(necroses, selectedUnit) {
    // Total de casos
    document.getElementById('total-casos').textContent = necroses.length;
    
    // Unidade selecionada
    document.getElementById('unidade-selecionada').textContent = selectedUnit || 'Todas';
    
    // Casos severos
    const casesSeveros = necroses.filter(necrose => 
        necrose.grau_necrose && necrose.grau_necrose.toLowerCase().includes('severo')
    ).length;
    document.getElementById('casos-severos').textContent = casesSeveros;
    
    // Tamanho médio
    const tamanhos = necroses.map(necrose => necrose.tamanho_total).filter(t => t > 0);
    const tamanhoMedio = tamanhos.length > 0 
        ? (tamanhos.reduce((a, b) => a + b, 0) / tamanhos.length).toFixed(2)
        : '0.00';
    document.getElementById('tamanho-medio').textContent = `${tamanhoMedio} cm`;
}

let allNecroses = []; // Armazenar todos os dados para filtrar
let allStatsByUnit = {}; // Armazenar estatísticas por unidade
let allUnits = []; // Armazenar todas as unidades

function loadAnalysisData() {
    const cardsContainer = document.getElementById('analysis-cards');
    const summaryContainer = document.getElementById('unit-summary-cards');
    
    cardsContainer.innerHTML = '<div class="loading-message">Carregando dados...</div>';
    summaryContainer.innerHTML = '<div class="loading-message">Carregando resumo...</div>';
    
    // Carregar dados de análise e estatísticas em paralelo
    Promise.all([
        fetch('/api/necrose_analise_data').then(response => response.json()),
        fetch('/api/necrose_statistics').then(response => response.json())
    ])
    .then(([analysisData, statisticsData]) => {
        if (analysisData.success) {
            allNecroses = analysisData.data;
            allStatsByUnit = analysisData.stats_by_unit;
            allUnits = analysisData.all_units;
            
            // Atualizar filtro de unidades
            updateUnitFilter();
            
            // Exibir cards de resumo por unidade
            displayUnitSummaryCards(allStatsByUnit, allUnits);
            
            // Exibir cards de análise
            displayAnalysisCards(allNecroses);
            updateStats(allNecroses);
        } else {
            cardsContainer.innerHTML = '<div class="loading-message">Erro ao carregar dados</div>';
            summaryContainer.innerHTML = '';
            console.error('Erro na API de análise:', analysisData.error);
        }
        
        // Atualizar cartões de estatísticas específicas
        if (statisticsData.success) {
            updateStatisticsCards(statisticsData.statistics);
        } else {
            console.error('Erro na API de estatísticas:', statisticsData.error);
        }
    })
    .catch(error => {
        cardsContainer.innerHTML = '<div class="loading-message">Erro de conexão</div>';
        summaryContainer.innerHTML = '';
        console.error('Erro:', error);
    });
}

function updateStatisticsCards(stats) {
    // Atualizar os cartões com os dados específicos solicitados
    document.getElementById('total-casos').textContent = stats.total_casos || '--';
    document.getElementById('media-densidade').textContent = stats.media_densidade_primeira_faixa || '--';
    document.getElementById('media-solucao-frente').textContent = stats.media_solucao_frente || '--';
    document.getElementById('media-infiltracao').textContent = stats.media_infiltracao || '--';
    document.getElementById('media-sangramento').textContent = stats.media_sangramento || '--';
    document.getElementById('casos-transamin').textContent = stats.casos_com_transamin || '--';
    document.getElementById('casos-tadalafil').textContent = stats.casos_com_tadalafil || '--';
}

function updateUnitFilter() {
    const unitFilter = document.getElementById('filter-unit');
    const currentValue = unitFilter.value;
    
    // Limpar opções existentes (exceto "Todas as Unidades")
    unitFilter.innerHTML = '<option value="">Todas as Unidades</option>';
    
    // Adicionar todas as unidades disponíveis
    allUnits.forEach(unit => {
        const option = document.createElement('option');
        option.value = unit;
        option.textContent = unit;
        unitFilter.appendChild(option);
    });
    
    // Restaurar valor selecionado
    unitFilter.value = currentValue;
}

function applyFilters() {
    const unitFilter = document.getElementById('filter-unit').value;
    const monthFilter = document.getElementById('filter-month').value;
    const yearFilter = document.getElementById('filter-year').value;
    
    let filteredNecroses = allNecroses;
    
    // Filtrar por unidade
    if (unitFilter) {
        filteredNecroses = filteredNecroses.filter(necrose => 
            necrose.unidade === unitFilter
        );
    }
    
    // Filtrar por mês
    if (monthFilter) {
        filteredNecroses = filteredNecroses.filter(necrose => {
            const date = necrose.data_cirurgia || necrose.data_avaliacao;
            if (date) {
                const month = date.split('/')[1];
                return month === monthFilter;
            }
            return false;
        });
    }
    
    // Filtrar por ano
    if (yearFilter) {
        filteredNecroses = filteredNecroses.filter(necrose => {
            const date = necrose.data_cirurgia || necrose.data_avaliacao;
            if (date) {
                const year = date.split('/')[2];
                return year === yearFilter;
            }
            return false;
        });
    }
    
    // Atualizar exibição
    displayAnalysisCards(filteredNecroses);
    updateStats(filteredNecroses, unitFilter);
}

function exportData() {
    const unitFilter = document.getElementById('filter-unit').value;
    const monthFilter = document.getElementById('filter-month').value;
    const yearFilter = document.getElementById('filter-year').value;
    
    const params = new URLSearchParams();
    if (unitFilter) params.append('unit', unitFilter);
    if (monthFilter) params.append('month', monthFilter);
    if (yearFilter) params.append('year', yearFilter);
    
    const url = `/download_combined_data?${params.toString()}`;
    window.open(url, '_blank');
}

// Adicionar gradientes adicionais para os cards de unidade

    .gradient-red {
        background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
    }
    .gradient-green {
        background: linear-gradient(135deg, #28a745 0%, #20c997 100%) !important;
    }
    .gradient-gray {
        background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%) !important;
    }
`;

// Adicionar estilos ao documento
if (!document.getElementById('dynamic-styles')) {
    const styleElement = document.createElement('style');
    styleElement.id = 'dynamic-styles';
    styleElement.textContent = additionalStyles;
    document.head.appendChild(styleElement);
}

// Carregar dados quando a página carrega
document.addEventListener('DOMContentLoaded', function() {
    loadAnalysisData();
    
    // Adicionar event listeners após DOM estar carregado
    const unitFilter = document.getElementById('filter-unit');
    const monthFilter = document.getElementById('filter-month');
    const yearFilter = document.getElementById('filter-year');
    
    if (unitFilter) unitFilter.addEventListener('change', applyFilters);
    if (monthFilter) monthFilter.addEventListener('change', applyFilters);
    if (yearFilter) yearFilter.addEventListener('change', applyFilters);
});

</script>

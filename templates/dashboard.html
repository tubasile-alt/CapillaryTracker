{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    <h2>Dashboard de Pacientes por Unidade</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    {% if data %}
    <div class="chart-container">
        <canvas id="monthlyChart"></canvas>
    </div>

    <div class="chart-container">
        <canvas id="folliclesChart"></canvas>
    </div>

    <div class="chart-container">
        <canvas id="densityChart"></canvas>
    </div>
    {% else %}
    <p class="no-data">Nenhum dado disponível para exibição.</p>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    {% if data %}
    const ctx = document.getElementById('monthlyChart').getContext('2d');
    const folliclesCtx = document.getElementById('folliclesChart').getContext('2d');
    const densityCtx = document.getElementById('densityChart').getContext('2d');
    const colors = ['#FF6384', '#36A2EB', '#FFCE56'];

    // Patients per unit chart
    const chartData = {
        labels: {{ data.labels | tojson }},
        datasets: {{ data.datasets | tojson }}.map((dataset, index) => ({
            ...dataset,
            backgroundColor: colors[index % colors.length],
            borderColor: colors[index % colors.length],
            borderWidth: 2,
            fill: false
        }))
    };

    new Chart(ctx, {
        type: 'line',
        data: chartData,
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Pacientes por Mês/Unidade'
                },
                legend: {
                    position: 'bottom'
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });

    // Average follicles per month chart
    new Chart(folliclesCtx, {
        type: 'bar',
        data: {
            labels: {{ data.follicles_data.labels | tojson }},
            datasets: [{
                label: 'Média de Fios por Mês',
                data: {{ data.follicles_data.averages | tojson }},
                backgroundColor: '#4CAF50',
                borderColor: '#388E3C',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Média de Fios Implantados por Mês'
                },
                legend: {
                    position: 'bottom'
                }
            },
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    // LE Density per month chart
    new Chart(densityCtx, {
        type: 'bar',
        data: {
            labels: {{ data.follicles_data.labels | tojson }},
            datasets: [{
                label: 'Média de Densidade LE por Mês',
                data: {{ data.follicles_data.le_density | tojson }},
                backgroundColor: '#9C27B0',
                borderColor: '#7B1FA2',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Média de Densidade LE (Primeira Faixa) por Mês'
                },
                legend: {
                    position: 'bottom'
                }
            },
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
    {% endif %}
</script>
{% endblock %}
